name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.8.1 or 1.8.1-rc1)'
        required: true
        default: '1.8.1'

jobs:
  verify-and-release:
    name: Verify, Build, and Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: safe_elementor_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, json, sodium, openssl, pdo_sqlite, sqlite3, pdo_mysql, mysqli, zip
          coverage: none

      - name: Determine Target Version
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "target_version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Enforce Tag / Source Version Consistency
        id: verify_ver
        run: php scripts/verify-release-version.php "${{ steps.target.outputs.target_version }}"

      - name: Verify Pre-Existing Git Tag Points to Current HEAD
        id: verify_tag
        run: |
          RAW_TARGET="${{ steps.target.outputs.target_version }}"
          TAG_NAME="$RAW_TARGET"
          if [[ ! "$TAG_NAME" =~ ^v ]]; then
            TAG_NAME="v${TAG_NAME}"
          fi
          echo "Verifying pre-existing Git tag: ${TAG_NAME}..."

          git fetch --tags --force origin 2>/dev/null || true

          RESOLVED_TAG=""
          if git rev-parse "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            RESOLVED_TAG="${TAG_NAME}"
          elif git rev-parse "refs/tags/${RAW_TARGET}" >/dev/null 2>&1; then
            RESOLVED_TAG="${RAW_TARGET}"
          else
            echo "FATAL: Pre-existing Git tag '${TAG_NAME}' or '${RAW_TARGET}' was not found."
            echo "Release dispatch must NEVER create a Git tag implicitly. Maintainer must create and push the tag first."
            exit 1
          fi

          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${RESOLVED_TAG}")
          HEAD_COMMIT="${{ github.sha }}"

          echo "Tag '${RESOLVED_TAG}' points to: ${TAG_COMMIT}"
          echo "Workflow commit SHA:           ${HEAD_COMMIT}"

          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "FATAL: Pre-existing tag '${RESOLVED_TAG}' points to ${TAG_COMMIT}, which does not match workflow HEAD ${HEAD_COMMIT}."
            echo "Releases may only be published for commits strictly pointed to by the tag."
            exit 1
          fi

          echo "Tag verification successful: ${RESOLVED_TAG} matches HEAD."
          echo "tag_name=${RESOLVED_TAG}" >> $GITHUB_OUTPUT

      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Setup Real WordPress Environment
        run: |
          mkdir -p /tmp/wordpress
          wp core download --version=6.9 --path=/tmp/wordpress --force
          wp config create --path=/tmp/wordpress --dbname=safe_elementor_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path=/tmp/wordpress --url=http://localhost --title="Safe Elementor Test" --admin_user=admin --admin_password=adminpass123 --admin_email=admin@example.com
          curl -fLo /tmp/mcp-adapter.zip https://github.com/WordPress/mcp-adapter/releases/download/v0.6.1/mcp-adapter.zip
          wp plugin install /tmp/mcp-adapter.zip --activate --path=/tmp/wordpress
          wp plugin is-active mcp-adapter --path=/tmp/wordpress || { echo "FATAL: MCP Adapter failed to activate"; exit 1; }
          wp plugin install elementor --activate --path=/tmp/wordpress
          wp plugin is-active elementor --path=/tmp/wordpress || { echo "FATAL: Elementor failed to activate"; exit 1; }

      - name: Run Standalone Test Suite (Phases 1-7)
        run: |
          php tests/test-phase1-foundation.php
          php tests/test-phase2-journal.php
          php tests/test-phase3-validation.php
          php tests/test-phase4-middleware.php
          php tests/test-phase5-checkpoints.php
          php tests/test-phase6-audit-tools.php
          php tests/test-phase7-release-concurrency.php
          php tests/test-elementor-compatibility.php

      - name: Run MySQL Safety & Concurrency Suites
        env:
          WP_PATH: /tmp/wordpress
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: safe_elementor_test
        run: |
          php tests/test-mysql-safety.php
          php tests/test-mysql-concurrency.php
          php tests/test-process-crash-recovery.php

      - name: Build Release Package
        run: php scripts/build-release.php

      - name: Verify Release Package & Single Root full-elementor-mcp/
        run: |
          TARGET_VER="${{ steps.verify_ver.outputs.base_version }}"
          test -f dist/manifest.json || { echo "Missing manifest.json"; exit 1; }
          test -f "dist/safe-elementor-mcp-${TARGET_VER}.zip" || { echo "Missing ZIP for ${TARGET_VER}"; exit 1; }
          test -f "dist/safe-elementor-mcp-${TARGET_VER}.zip.sha256" || { echo "Missing SHA256 for ${TARGET_VER}"; exit 1; }
          ZIP_COUNT=$(ls -1 dist/safe-elementor-mcp-*.zip 2>/dev/null | wc -l)
          test "$ZIP_COUNT" -eq 1 || { echo "Expected exactly 1 versioned ZIP, found $ZIP_COUNT"; exit 1; }
          test ! -f dist/safe-elementor-mcp.zip || { echo "Forbidden unversioned alias safe-elementor-mcp.zip found"; exit 1; }
          SHA_COUNT=$(ls -1 dist/safe-elementor-mcp-*.zip.sha256 2>/dev/null | wc -l)
          test "$SHA_COUNT" -eq 1 || { echo "Expected exactly 1 SHA256 file, found $SHA_COUNT"; exit 1; }

      - name: Execute Pre-Phase 7 Upgrade Smoke Test from Phase 6 Baseline
        env:
          WP_PATH: /tmp/wordpress
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: safe_elementor_test
        run: php tests/test-phase6-upgrade-smoke.php

      - name: Execute WordPress Package Lifecycle Suite
        env:
          WP_PATH: /tmp/wordpress
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: safe_elementor_test
        run: php tests/test-wordpress-package-lifecycle.php

      - name: Create Draft Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify_tag.outputs.tag_name }}
          name: Safe Elementor MCP ${{ steps.verify_ver.outputs.version }}
          draft: true
          prerelease: ${{ steps.verify_ver.outputs.is_prerelease == 'true' }}
          files: |
            dist/safe-elementor-mcp-*.zip
            dist/safe-elementor-mcp-*.zip.sha256
            dist/manifest.json
          generate_release_notes: true
