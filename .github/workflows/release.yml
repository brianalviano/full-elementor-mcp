name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.8.0)'
        required: true
        default: '1.8.0'

jobs:
  build-and-release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: curl, mbstring, json, sodium, openssl, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Run Complete Test Suite
        run: |
          php tests/test-phase1-foundation.php
          php tests/test-phase2-journal.php
          php tests/test-phase3-validation.php
          php tests/test-phase4-middleware.php
          php tests/test-phase5-checkpoints.php
          php tests/test-phase6-audit-tools.php
          php tests/test-phase7-release-concurrency.php

      - name: Build Release Archive
        run: php scripts/build-release.php

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.sha256
            dist/manifest.json
          generate_release_notes: true
