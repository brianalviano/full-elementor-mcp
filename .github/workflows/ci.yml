name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  php-lint:
    name: PHP Syntax Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Lint all PHP files
        run: |
          find . -name "*.php" ! -path "./vendor/*" ! -path "./node_modules/*" -exec php -l {} +

  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: php-lint
    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, mbstring, json, sodium, openssl, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Run Phase 1 Foundation Tests
        run: php tests/test-phase1-foundation.php

      - name: Run Phase 2 Journal Tests
        run: php tests/test-phase2-journal.php

      - name: Run Phase 3 Validation Tests
        run: php tests/test-phase3-validation.php

      - name: Run Phase 4 Middleware Tests
        run: php tests/test-phase4-middleware.php

      - name: Run Phase 5 Checkpoint Tests
        run: php tests/test-phase5-checkpoints.php

      - name: Run Phase 6 Audit & Recovery Tests
        run: php tests/test-phase6-audit-tools.php

      - name: Run Phase 7 Release & Concurrency Tests
        run: php tests/test-phase7-release-concurrency.php

      - name: Run Elementor Compatibility Suite
        run: php tests/test-elementor-compatibility.php

  wordpress-integration:
    name: WordPress Integration (WP ${{ matrix.wp-version }}, Elementor ${{ matrix.elementor-version }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - wp-version: '6.9'
            elementor-version: '3.20.4'
          - wp-version: '6.9'
            elementor-version: 'latest'
          - wp-version: '7.1'
            elementor-version: 'latest'
          - wp-version: '7.1'
            elementor-version: '4.2.4'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: safe_elementor_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, json, sodium, openssl, pdo_mysql, mysqli, zip
          coverage: none

      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Setup WordPress ${{ matrix.wp-version }}
        run: |
          mkdir -p /tmp/wordpress
          wp core download --version=${{ matrix.wp-version }} --path=/tmp/wordpress --force
          wp config create --path=/tmp/wordpress --dbname=safe_elementor_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path=/tmp/wordpress --url=http://localhost --title="Safe Elementor Test" --admin_user=admin --admin_password=adminpass123 --admin_email=admin@example.com

      - name: Install Real WordPress MCP Adapter Release
        run: |
          curl -fLo /tmp/mcp-adapter.zip https://github.com/WordPress/mcp-adapter/releases/download/v0.6.1/mcp-adapter.zip
          wp plugin install /tmp/mcp-adapter.zip --activate --path=/tmp/wordpress
          wp plugin is-active mcp-adapter --path=/tmp/wordpress || { echo "FATAL: MCP Adapter failed to activate"; exit 1; }

      - name: Install Real Elementor Package (${{ matrix.elementor-version }})
        run: |
          if [ "${{ matrix.elementor-version }}" = "latest" ]; then
            wp plugin install elementor --activate --path=/tmp/wordpress
          else
            wp plugin install elementor --version=${{ matrix.elementor-version }} --activate --path=/tmp/wordpress
          fi
          wp plugin is-active elementor --path=/tmp/wordpress || { echo "FATAL: Elementor failed to activate"; exit 1; }

      - name: Run WordPress + MySQL Integration Tests
        env:
          WP_PATH: /tmp/wordpress
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: safe_elementor_test
        run: php tests/test-wordpress-integration.php

  mysql-safety:
    name: Real MySQL Safety Contracts
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: safe_elementor_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, json, sodium, openssl, pdo_mysql, mysqli, zip
          coverage: none

      - name: Run Real MySQL Safety Contract Tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: safe_elementor_test
        run: php tests/test-mysql-safety.php

  concurrency:
    name: Multi-Process Concurrency & Crash Recovery
    runs-on: ubuntu-latest
    needs: mysql-safety
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: safe_elementor_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, json, sodium, openssl, pdo_mysql, mysqli, zip
          coverage: none

      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Setup Real WordPress Environment
        run: |
          mkdir -p /tmp/wordpress
          wp core download --version=6.9 --path=/tmp/wordpress --force
          wp config create --path=/tmp/wordpress --dbname=safe_elementor_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path=/tmp/wordpress --url=http://localhost --title="Safe Elementor Test" --admin_user=admin --admin_password=adminpass123 --admin_email=admin@example.com
          wp plugin install elementor --activate --path=/tmp/wordpress

      - name: Run Real MySQL Concurrency Test Suite
        env:
          WP_PATH: /tmp/wordpress
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: safe_elementor_test
        run: php tests/test-mysql-concurrency.php

      - name: Run Real Process Crash & Recovery Test Suite
        env:
          WP_PATH: /tmp/wordpress
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: safe_elementor_test
        run: php tests/test-process-crash-recovery.php

  package-validation:
    name: Package Validation & Baseline Upgrade Smoke
    runs-on: ubuntu-latest
    needs: [ wordpress-integration, concurrency ]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: safe_elementor_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - name: Checkout code with full history for baseline archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, json, hash, zip, openssl, sodium, pdo_mysql, mysqli
          coverage: none

      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Setup Real WordPress Environment
        run: |
          mkdir -p /tmp/wordpress
          wp core download --version=6.9 --path=/tmp/wordpress --force
          wp config create --path=/tmp/wordpress --dbname=safe_elementor_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path=/tmp/wordpress --url=http://localhost --title="Safe Elementor Test" --admin_user=admin --admin_password=adminpass123 --admin_email=admin@example.com
          curl -fLo /tmp/mcp-adapter.zip https://github.com/WordPress/mcp-adapter/releases/download/v0.6.1/mcp-adapter.zip
          wp plugin install /tmp/mcp-adapter.zip --activate --path=/tmp/wordpress
          wp plugin is-active mcp-adapter --path=/tmp/wordpress || { echo "FATAL: MCP Adapter failed to activate"; exit 1; }
          wp plugin install elementor --activate --path=/tmp/wordpress
          wp plugin is-active elementor --path=/tmp/wordpress || { echo "FATAL: Elementor failed to activate"; exit 1; }

      - name: Execute Release Build Script
        run: php scripts/build-release.php

      - name: Verify Release Artifacts & Single Root full-elementor-mcp/
        run: |
          test -f dist/manifest.json || { echo "Missing manifest.json"; exit 1; }
          ZIP_COUNT=$(ls -1 dist/safe-elementor-mcp-*.zip 2>/dev/null | wc -l)
          test "$ZIP_COUNT" -eq 1 || { echo "Expected exactly 1 versioned ZIP, found $ZIP_COUNT"; exit 1; }
          test ! -f dist/safe-elementor-mcp.zip || { echo "Forbidden unversioned alias safe-elementor-mcp.zip found"; exit 1; }
          SHA_COUNT=$(ls -1 dist/safe-elementor-mcp-*.zip.sha256 2>/dev/null | wc -l)
          test "$SHA_COUNT" -eq 1 || { echo "Expected exactly 1 SHA256 file, found $SHA_COUNT"; exit 1; }
          ls -la dist/
          cat dist/manifest.json

      - name: Execute Pre-Phase 7 Upgrade Smoke Test from Phase 6 Baseline
        env:
          WP_PATH: /tmp/wordpress
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: safe_elementor_test
        run: php tests/test-phase6-upgrade-smoke.php

      - name: Execute WordPress Package Lifecycle Suite
        env:
          WP_PATH: /tmp/wordpress
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: safe_elementor_test
        run: php tests/test-wordpress-package-lifecycle.php
